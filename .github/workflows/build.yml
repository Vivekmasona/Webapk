name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle 8.1.1
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.1.1'

    - name: Auto-Create Missing Gradle Files
      run: |
        if [ ! -f settings.gradle ]; then
          echo "include ':app'" > settings.gradle
          echo 'rootProject.name = "Webapk"' >> settings.gradle
        fi
        if [ ! -f build.gradle ]; then
          printf "buildscript {\n    repositories {\n        google()\n        mavenCentral()\n    }\n    dependencies {\n        classpath 'com.android.tools.build:gradle:8.1.1'\n    }\n}\nallprojects {\n    repositories {\n        google()\n        mavenCentral()\n    }\n}\n" > build.gradle
        fi
        mkdir -p app
        if [ ! -f app/build.gradle ]; then
          printf "plugins {\n    id 'com.android.application'\n}\nandroid {\n    namespace 'com.vidofy.app'\n    compileSdk 34\n    defaultConfig {\n        applicationId 'com.vidofy.app'\n        minSdk 24\n        targetSdk 34\n        versionCode 1\n        versionName '1.0'\n    }\n}\ndependencies {\n    implementation 'androidx.appcompat:appcompat:1.6.1'\n    implementation 'com.google.android.material:material:1.9.0'\n    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'\n}\n" > app/build.gradle
        fi

    - name: Build Debug APK with Gradle
      run: gradle assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
